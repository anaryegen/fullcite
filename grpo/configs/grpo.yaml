citation_format: full
reward_policy: as_written

model: runs/sft-qwen3-8b-merged
data: data/snippet_citation_train.json
output_dir: runs/grpo-qwen3-8b

num_generations: 8
max_completion_length: 1024
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
# One rollout per accumulation sub-step keeps long-prompt batches within memory.
steps_per_generation: 1
learning_rate: 3.0e-5
beta: 0.04
temperature: 0.9
top_p: 0.95
max_steps: 1000
save_steps: 300
logging_steps: 200
seed: 42
rollout: hf

use_lora: true
lora_r: 64
lora_alpha: 128

reward:
  # Soft format gate for the first 50 steps, hard afterwards.
  graded_gate_warmup_steps: 50
  snippet_min_chars: 20
  snippet_max_chars: 512
  wrong_doc_penalty: 0.25
  support_scorer: nli
  nli_model: cross-encoder/nli-deberta-v3-base
  nli_batch_size: 64
  weights:
    answer: 1.0
    doc: 1.0
    span: 1.0
    support: 1.0
    omission: 0.5
    verbose: 0.0
    dup: 0.0
    coverage: 0.0
